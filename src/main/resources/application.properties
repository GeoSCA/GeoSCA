spring.application.name=gestioncooperativa

# Conexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_GeoSCA
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Opcional
# Configure a strong APP_ADMIN_PASSWORD before the first production startup.
app.admin.password=${APP_ADMIN_PASSWORD:Admin12345!}

# Session expires after 30 minutes of inactivity.
server.servlet.session.timeout=30m