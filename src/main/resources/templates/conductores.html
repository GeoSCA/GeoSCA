<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conductores - GeoSCA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="drivers-page">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4 users-toolbar">
        <h2 class="users-title drivers-title">Conductores</h2>
        <div>
            <a th:href="@{/dashboard}" class="btn btn-secondary">Dashboard</a>
            <a th:if="${puedeAdministrar}" th:href="@{/conductores/nuevo}" class="btn btn-success btn-create users-create-link">+ Nuevo conductor</a>
        </div>
    </div>
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="table-responsive users-table-card">
    <table class="table table-bordered table-striped table-hover">
        <thead class="table-dark"><tr><th>ID</th><th>Cédula</th><th>Nombres</th><th>Apellidos</th><th>Licencia</th><th>Caducidad licencia</th><th>Teléfono</th><th>Correo</th><th>Cooperativa</th><th>Estado</th><th th:if="${puedeAdministrar}">Acciones</th></tr></thead>
        <tbody>
        <tr th:each="conductor : ${conductores}">
            <td th:text="${conductor.idConductor}"></td><td th:text="${conductor.cedula}"></td><td th:text="${conductor.nombres}"></td>
            <td th:text="${conductor.apellidos}"></td><td th:text="${conductor.licencia}"></td>
            <td th:text="${conductor.fechaCaducidadLicencia}"></td><td th:text="${conductor.telefono}"></td>
            <td th:text="${conductor.correo}"></td>
            <td th:text="${conductor.cooperativa != null ? conductor.cooperativa.nombre : ''}"></td><td><span class="status-badge" th:text="${conductor.estado}"></span></td>
            <td th:if="${puedeAdministrar}">
                <a th:href="@{/conductores/editar/{id}(id=${conductor.idConductor})}" class="btn btn-warning btn-sm users-edit">Editar</a>
                <form th:action="@{/conductores/eliminar/{id}(id=${conductor.idConductor})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-danger btn-sm users-delete" onclick="return confirm('¿Está seguro de que desea eliminar este conductor?');">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
</div>
</body>
</html>
