<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - GeoSCA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="login-page">
<main class="login-shell">
    <aside class="login-visual" aria-hidden="true">
        <svg class="login-art" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice">
            <path class="login-route" d="M-40 690 C120 690 120 530 260 530 S390 650 500 520 S660 330 850 330"/>
            <path class="login-route" d="M180 -40 C180 150 350 140 350 300 S250 420 340 520"/>
            <circle class="login-route-node" cx="260" cy="530" r="8"/>
            <circle class="login-route-node" cx="500" cy="520" r="8"/>
            <circle class="login-route-node" cx="350" cy="300" r="8"/>
        </svg>
        <div class="login-brand-mark"><i class="bi bi-bus-front-fill"></i></div>
    </aside>
    <section class="login-content">
        <div class="card login-card">
            <div class="card-body">
                <h2 class="login-brand">GeoSCA</h2>
                <form class="login-form" th:action="@{/login}" method="post">
                    <div class="alert alert-danger login-alert" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
                    <div class="alert alert-success login-alert" th:if="${param.logout}">Sesión cerrada correctamente.</div>
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <div class="login-input-wrap">
                            <i class="bi bi-person login-input-icon" aria-hidden="true"></i>
                            <input id="username" name="username" type="text" class="form-control" autocomplete="username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <div class="login-input-wrap">
                            <i class="bi bi-lock login-input-icon" aria-hidden="true"></i>
                            <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary login-submit w-100">Iniciar sesión</button>
                </form>
            </div>
        </div>
    </section>
</main>
</body>
</html>
