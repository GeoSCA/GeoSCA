<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parroquia - GeoSCA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="user-form-page parish-form-page">
<div class="container mt-5">
    <header class="user-form-heading parish-form-title">
        <h2>Gestión de Parroquia</h2>
    </header>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form class="form-panel user-form-panel parish-form-panel" th:action="@{/parroquias/guardar}" th:object="${parroquia}" method="post">
        <input type="hidden" th:field="*{idParroquia}">
        <div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}" required></div>
        <div class="mb-3"><label class="form-label">Cantón</label><input class="form-control" value="Latacunga" readonly></div>
        <input type="hidden" th:field="*{canton}">
        <div class="mb-3"><label class="form-label">Provincia</label><input class="form-control" value="Cotopaxi" readonly></div>
        <input type="hidden" th:field="*{provincia}">
        <div class="mb-3"><label class="form-label">Estado</label><select class="form-select" th:field="*{estado}" required><option value="">Seleccione un estado</option><option value="ACTIVA">Activa</option><option value="INACTIVA">Inactiva</option></select></div>
        <div class="user-form-actions">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/parroquias-web}" class="btn btn-secondary">Volver</a>
        </div>
    </form>
</div>
</body>
</html>
