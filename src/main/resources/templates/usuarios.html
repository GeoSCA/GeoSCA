<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="users-page">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4 users-toolbar">
        <h2 class="users-title">Lista de Usuarios</h2>
        <div>
            <a th:href="@{/dashboard}" class="btn btn-secondary">Dashboard</a>
            <a th:href="@{/roles-web}" class="btn btn-info users-roles-link">Consultar roles</a>
            <a th:href="@{/usuarios/nuevo}" class="btn btn-success btn-create users-create-link">+ Nuevo usuario</a>
        </div>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="table-responsive users-table-card">
    <table class="table table-bordered table-striped table-hover">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Correo</th>
                <th>Usuario</th>
                <th>Rol</th>
                <th>Cooperativa</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="usuario : ${usuarios}">

                <td th:text="${usuario.idUsuario}"></td>
                <td th:text="${usuario.nombre}"></td>
                <td th:text="${usuario.apellido}"></td>
                <td th:text="${usuario.correo}"></td>
                <td th:text="${usuario.username}"></td>
                <td th:text="${usuario.rol != null ? usuario.rol.nombre : '-'}"></td>
                <td th:text="${usuario.cooperativa != null ? usuario.cooperativa.nombre : '-'}"></td>
                <td><span class="status-badge" th:text="${usuario.estado != null and usuario.estado ? 'Activo' : 'Inactivo'}"></span></td>
                <td>
                    <span class="text-muted" th:if="${usuario.rol != null and #strings.equalsIgnoreCase(usuario.rol.nombre, 'ADMIN_GENERAL')}">Protegido</span>
                    <a th:unless="${usuario.rol != null and #strings.equalsIgnoreCase(usuario.rol.nombre, 'ADMIN_GENERAL')}" th:href="@{/usuarios/editar/{id}(id=${usuario.idUsuario})}" class="btn btn-warning btn-sm users-edit">Editar</a>
                    <form th:unless="${usuario.rol != null and #strings.equalsIgnoreCase(usuario.rol.nombre, 'ADMIN_GENERAL')}" th:action="@{/usuarios/estado/{id}(id=${usuario.idUsuario})}" method="post" class="d-inline">
                        <input type="hidden" name="activo" th:value="${usuario.estado != null and usuario.estado ? 'false' : 'true'}"/>
                        <button type="submit" class="btn btn-secondary btn-sm users-toggle" th:text="${usuario.estado != null and usuario.estado ? 'Desactivar' : 'Activar'}"></button>
                    </form>
                    <form th:unless="${usuario.rol != null and #strings.equalsIgnoreCase(usuario.rol.nombre, 'ADMIN_GENERAL')}" th:action="@{/usuarios/eliminar/{id}(id=${usuario.idUsuario})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-danger btn-sm users-delete" onclick="return confirm('¿Está seguro de que desea eliminar este usuario?');">Eliminar</button>
                    </form>
                </td>

            </tr>
        </tbody>
    </table>
    </div>

</div>

</body>
</html>
