<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Autobús - GeoSCA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="user-form-page bus-form-page">
<div class="container mt-5">
    <header class="user-form-heading bus-form-title">
        <h2>Gestión de Autobús</h2>
    </header>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form class="form-panel user-form-panel bus-form-panel" th:action="@{/autobuses/guardar}" th:object="${autobus}" method="post">
        <input type="hidden" th:field="*{idAutobus}">
        <div class="mb-3 bus-field-plate"><label class="form-label">Placa</label><input class="form-control" th:field="*{placa}" required></div>
        <div class="mb-3 bus-field-make"><label class="form-label">Marca</label><input class="form-control" th:field="*{marca}" required></div>
        <div class="mb-3 bus-field-model"><label class="form-label">Modelo</label><input class="form-control" th:field="*{modelo}" required></div>
        <div class="mb-3 bus-field-year"><label class="form-label">Año</label><input type="number" min="1900" class="form-control" th:field="*{anio}" required></div>
        <div class="mb-3 bus-field-capacity"><label class="form-label">Capacidad</label><input type="number" min="1" class="form-control" th:field="*{capacidad}" required></div>
        <div class="mb-3 bus-field-cooperative" th:if="${esAdminGeneral}">
            <label class="form-label">Cooperativa</label>
            <select class="form-select" th:field="*{cooperativa.idCooperativa}" required>
                <option value="">Seleccione una cooperativa</option>
                <option th:each="cooperativa : ${cooperativas}" th:value="${cooperativa.idCooperativa}" th:text="${cooperativa.nombre}"></option>
            </select>
        </div>
        <input th:unless="${esAdminGeneral}" type="hidden" th:field="*{cooperativa.idCooperativa}">
        <div class="mb-3 bus-field-state"><label class="form-label">Estado</label><select class="form-select" th:field="*{estado}" required><option value="">Seleccione un estado</option><option value="ACTIVO">Activo</option><option value="INACTIVO">Inactivo</option></select></div>
        <div class="user-form-actions">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/autobuses-web}" class="btn btn-secondary">Volver</a>
        </div>
    </form>
</div>
</body>
</html>
