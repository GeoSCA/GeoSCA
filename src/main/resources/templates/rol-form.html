<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rol - GeoSCA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="user-form-page role-form-page">
<div class="container mt-5">
    <header class="user-form-heading role-form-title">
        <h2>Gestión de Rol</h2>
    </header>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form class="form-panel user-form-panel role-form-panel" th:action="@{/roles/guardar}" th:object="${rol}" method="post">
        <input type="hidden" th:field="*{idRol}">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input class="form-control" th:field="*{nombre}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
        </div>

        <fieldset class="mb-3 role-permissions">
            <legend class="fs-6">Permisos</legend>
            <div class="form-check" th:each="permiso : ${permisos}">
                <input class="form-check-input" type="checkbox" name="permisoIds"
                       th:id="'permiso-' + ${permiso.idPermiso}" th:value="${permiso.idPermiso}"
                       th:checked="${rol.permisos != null and rol.permisos.![idPermiso].contains(permiso.idPermiso)}"
                       th:disabled="${'ADMIN_GENERAL'.equals(rol.nombre)}">
                <label class="form-check-label" th:for="'permiso-' + ${permiso.idPermiso}">
                    <span th:text="${permiso.nombre}"></span>
                    <small class="text-muted" th:text="${permiso.descripcion}"></small>
                </label>
            </div>
            <small class="text-muted" th:if="${'ADMIN_GENERAL'.equals(rol.nombre)}">Los permisos del administrador general no se pueden modificar.</small>
        </fieldset>

        <div class="user-form-actions">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/roles-web}" class="btn btn-secondary">Volver</a>
        </div>
    </form>
</div>
</body>
</html>
