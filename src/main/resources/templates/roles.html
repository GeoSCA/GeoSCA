<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roles - GeoSCA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="roles-page">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4 users-toolbar">
        <h2 class="users-title roles-title">Roles existentes</h2>
        <div>
            <a th:href="@{/dashboard}" class="btn btn-secondary">Dashboard</a>
            <a th:href="@{/usuarios-web}" class="btn btn-info users-roles-link">Gestionar usuarios</a>
            <a th:href="@{/roles/nuevo}" class="btn btn-success btn-create users-create-link">+ Nuevo rol</a>
        </div>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="table-responsive users-table-card">
    <table class="table table-bordered table-striped table-hover">
        <thead class="table-dark">
        <tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Permisos</th><th>Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="rol : ${roles}">
            <td th:text="${rol.idRol}"></td>
            <td th:text="${rol.nombre}"></td>
            <td th:text="${rol.descripcion}"></td>
            <td>
                <span th:each="permiso, iter : ${rol.permisos}">
                    <span th:text="${permiso.nombre}"></span><span th:if="${!iter.last}">, </span>
                </span>
            </td>
            <td>
                <a th:href="@{/roles/editar/{id}(id=${rol.idRol})}" class="btn btn-warning btn-sm users-edit">Editar</a>
                <form th:if="${rol.nombre != 'ADMIN_GENERAL' and rol.nombre != 'ADMIN_COOPERATIVA'}"
                      th:action="@{/roles/eliminar/{id}(id=${rol.idRol})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-danger btn-sm users-delete" onclick="return confirm('¿Está seguro de que desea eliminar este rol?');">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
</div>
</body>
</html>
