<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ruta - GeoSCA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="user-form-page route-form-page">
<div class="container mt-5">
    <header class="user-form-heading route-form-title">
        <h2>Gestión de Ruta</h2>
    </header>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form class="form-panel user-form-panel route-form-panel" th:action="@{/rutas/guardar}" th:object="${ruta}" method="post">
        <input type="hidden" th:field="*{idRuta}">
        <div class="mb-3 route-field-name"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}" required></div>
        <div class="mb-3 route-field-origin"><label class="form-label">Origen</label>
            <select class="form-select" th:field="*{parroquiaOrigen.idParroquia}" required>
                <option value="">Seleccione parroquia de origen</option>
                <option th:each="parroquia : ${parroquias}" th:value="${parroquia.idParroquia}" th:text="${parroquia.nombre}"></option>
            </select>
        </div>
        <div class="mb-3 route-field-destination"><label class="form-label">Destino</label>
            <select class="form-select" th:field="*{parroquiaDestino.idParroquia}" required>
                <option value="">Seleccione parroquia de destino</option>
                <option th:each="parroquia : ${parroquias}" th:value="${parroquia.idParroquia}" th:text="${parroquia.nombre}"></option>
            </select>
        </div>
        <fieldset class="mb-3 route-stops-select">
            <legend class="fs-6">Parroquias intermedias</legend>
            <input type="hidden" name="paradasFormulario" value="true">
            <div class="form-check" th:each="parroquia : ${parroquias}">
                <input class="form-check-input" type="checkbox" name="paradaIds"
                       th:id="'parada-' + ${parroquia.idParroquia}" th:value="${parroquia.idParroquia}"
                       th:checked="${ruta.paradas != null and !#lists.isEmpty(ruta.paradas.?[idParroquia == parroquia.idParroquia])}">
                <label class="form-check-label" th:for="'parada-' + ${parroquia.idParroquia}"
                       th:text="${parroquia.nombre}"></label>
            </div>
        </fieldset>
        <div class="mb-3 route-field-distance"><label class="form-label">Distancia en kilómetros</label><input type="number" min="0" step="0.01" class="form-control" th:field="*{distanciaKm}"></div>
        <div class="mb-3 route-field-description"><label class="form-label">Descripción</label><textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea></div>
        <div class="mb-3 route-field-cooperative" th:if="${esAdminGeneral}">
            <label class="form-label">Cooperativa</label>
            <select class="form-select" th:field="*{cooperativa.idCooperativa}" required>
                <option value="">Seleccione una cooperativa</option>
                <option th:each="cooperativa : ${cooperativas}" th:value="${cooperativa.idCooperativa}" th:text="${cooperativa.nombre}"></option>
            </select>
        </div>
        <input th:unless="${esAdminGeneral}" type="hidden" th:field="*{cooperativa.idCooperativa}">
        <div class="mb-3 route-field-state"><label class="form-label">Estado</label><select class="form-select" th:field="*{estado}" required><option value="">Seleccione un estado</option><option value="ACTIVA">Activa</option><option value="INACTIVA">Inactiva</option></select></div>
        <div class="user-form-actions">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/rutas-web}" class="btn btn-secondary">Volver</a>
        </div>
    </form>
</div>
</body>
</html>
