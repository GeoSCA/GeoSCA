<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cooperativas - GeoSCA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="cooperatives-page">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4 users-toolbar">
        <h2 class="users-title cooperatives-title">Cooperativas</h2>
        <div>
            <a th:href="@{/dashboard}" class="btn btn-secondary">Dashboard</a>
            <a th:href="@{/cooperativas/nuevo}" class="btn btn-success btn-create users-create-link">+ Nueva cooperativa</a>
        </div>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="table-responsive users-table-card">
    <table class="table table-bordered table-striped table-hover">
        <thead class="table-dark">
        <tr><th>ID</th><th>Nombre</th><th>RUC</th><th>Dirección</th><th>Teléfono</th><th>Correo</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="cooperativa : ${cooperativas}">
            <td th:text="${cooperativa.idCooperativa}"></td>
            <td th:text="${cooperativa.nombre}"></td>
            <td th:text="${cooperativa.ruc}"></td>
            <td th:text="${cooperativa.direccion}"></td>
            <td th:text="${cooperativa.telefono}"></td>
            <td th:text="${cooperativa.correo}"></td>
            <td><span class="status-badge" th:text="${cooperativa.estado}"></span></td>
            <td>
                <a th:href="@{/cooperativas/editar/{id}(id=${cooperativa.idCooperativa})}" class="btn btn-warning btn-sm users-edit">Editar</a>
                <form th:if="${cooperativa.estado != null and #strings.equalsIgnoreCase(cooperativa.estado, 'ACTIVA')}" th:action="@{/cooperativas/inactivar/{id}(id=${cooperativa.idCooperativa})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-danger btn-sm users-inactivate" onclick="return confirm('¿Está seguro de que desea inactivar esta cooperativa?');">Inactivar</button>
                </form>
                <form th:if="${cooperativa.estado != null and #strings.equalsIgnoreCase(cooperativa.estado, 'INACTIVA')}" th:action="@{/cooperativas/activar/{id}(id=${cooperativa.idCooperativa})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-success btn-sm users-activate">Activar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
</div>
</body>
</html>
