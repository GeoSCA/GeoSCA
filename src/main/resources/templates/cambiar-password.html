<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambiar contraseña - GeoSCA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="user-form-page">
<div class="container mt-5">
    <header class="user-form-heading">
        <h2>Cambiar contraseña</h2>
    </header>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form class="form-panel user-form-panel" th:action="@{/cuenta/password}" method="post">
        <div class="mb-3">
            <label class="form-label" for="passwordActual">Contraseña actual</label>
            <input id="passwordActual" name="passwordActual" type="password" class="form-control"
                   autocomplete="current-password" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="nuevaPassword">Nueva contraseña</label>
            <input id="nuevaPassword" name="nuevaPassword" type="password" class="form-control"
                   autocomplete="new-password" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="confirmarNuevaPassword">Confirmar nueva contraseña</label>
            <input id="confirmarNuevaPassword" name="confirmarNuevaPassword" type="password" class="form-control"
                   autocomplete="new-password" required>
        </div>
        <div class="user-form-actions">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/dashboard}" class="btn btn-secondary">Volver al dashboard</a>
        </div>
    </form>
</div>
</body>
</html>
