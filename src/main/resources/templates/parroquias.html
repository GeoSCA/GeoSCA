<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parroquias - GeoSCA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="parishes-page">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4 users-toolbar">
        <h2 class="users-title parishes-title">Parroquias</h2>
        <div><a th:href="@{/dashboard}" class="btn btn-secondary">Dashboard</a> <a th:href="@{/parroquias/nuevo}" class="btn btn-success btn-create users-create-link">+ Nueva parroquia</a></div>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="table-responsive users-table-card">
    <table class="table table-bordered table-striped table-hover">
        <thead class="table-dark"><tr><th>ID</th><th>Nombre</th><th>Cantón</th><th>Provincia</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="parroquia : ${parroquias}">
            <td th:text="${parroquia.idParroquia}"></td><td th:text="${parroquia.nombre}"></td><td th:text="${parroquia.canton}"></td>
            <td th:text="${parroquia.provincia}"></td><td><span class="status-badge" th:text="${parroquia.estado}"></span></td>
            <td>
                <a th:href="@{/parroquias/editar/{id}(id=${parroquia.idParroquia})}" class="btn btn-warning btn-sm users-edit">Editar</a>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
</div>
</body>
</html>
