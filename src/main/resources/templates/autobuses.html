<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Autobuses - GeoSCA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="buses-page">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4 users-toolbar">
        <h2 class="users-title buses-title">Autobuses</h2>
        <div>
            <a th:href="@{/dashboard}" class="btn btn-secondary">Dashboard</a>
            <a th:if="${puedeAdministrar}" th:href="@{/autobuses/nuevo}" class="btn btn-success btn-create users-create-link">+ Nuevo autobús</a>
        </div>
    </div>
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="table-responsive users-table-card">
    <table class="table table-bordered table-striped table-hover">
        <thead class="table-dark"><tr><th>ID</th><th>Placa</th><th>Marca</th><th>Modelo</th><th>Año</th><th>Capacidad</th><th>Cooperativa</th><th>Estado</th><th th:if="${puedeAdministrar}">Acciones</th></tr></thead>
        <tbody>
        <tr th:each="autobus : ${autobuses}">
            <td th:text="${autobus.idAutobus}"></td><td th:text="${autobus.placa}"></td><td th:text="${autobus.marca}"></td>
            <td th:text="${autobus.modelo}"></td><td th:text="${autobus.anio}"></td><td th:text="${autobus.capacidad}"></td>
            <td th:text="${autobus.cooperativa != null ? autobus.cooperativa.nombre : ''}"></td>
            <td>
                <span class="status-badge" th:text="${autobus.estado}"></span>
                <form th:if="${puedeAdministrar}" th:action="@{/autobuses/estado/{id}(id=${autobus.idAutobus})}" method="post" class="d-flex gap-1 mt-1">
                    <select class="form-select form-select-sm" name="estado" aria-label="Actualizar estado">
                        <option value="ACTIVO" th:selected="${autobus.estado == 'ACTIVO'}">Activo</option>
                        <option value="INACTIVO" th:selected="${autobus.estado == 'INACTIVO'}">Inactivo</option>
                    </select>
                    <button type="submit" class="btn btn-outline-primary btn-sm autobus-state-update">Actualizar</button>
                </form>
            </td>
            <td th:if="${puedeAdministrar}">
                <a th:href="@{/autobuses/editar/{id}(id=${autobus.idAutobus})}" class="btn btn-warning btn-sm users-edit">Editar</a>
                <form th:action="@{/autobuses/eliminar/{id}(id=${autobus.idAutobus})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-danger btn-sm users-delete" onclick="return confirm('¿Está seguro de que desea eliminar este autobús?');">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
</div>
</body>
</html>
